name: Local Core Features CI

on:
  push:
    branches:
      - feat/core-local-task-planning
      - feat/core-morning-brief-gmail-trash
  pull_request:
    branches:
      - feat/core-local-task-planning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-tasks:
    name: task-board (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r apps/core/requirements-test.lock
      - name: Python offline tests
        env:
          PYTHONPATH: apps/core/src
          PYTHONNOUSERSITE: '1'
        run: python -m unittest discover -s apps/core/tests -v
      - name: UI and shell checks
        run: |
          bash -n scripts/run-okal-core.sh
          node --check apps/core/src/okal_core/static/app.js
          node --test apps/core/tests/test_inbox_status.cjs
