name: Local Core Features CI

on:
  push:
    branches:
      - feat/core-local-task-planning
      - feat/core-morning-brief-gmail-trash
      - feat/core-ai-morning-editor
      - feat/core-pro-dashboard-multiselect
      - feat/inbox-selection-clusters-inline-reader
      - feat/inbox-confirm-delete-message-details
      - feat/core-mail-agent-actions-v1
      - feat/core-local-planner-reminders-v1
      - feat/mail-long-content-resilient-analysis
      - fix/mail-viewer-images-responsive-reader
      - fix/mail-render-original-images-owner-voice
      - fix/mail-read-state-and-image-preferences
      - feat/core-daily-workflows-integration
  pull_request:
    branches:
      - main
      - fix/mail-render-original-images-owner-voice
      - fix/mail-viewer-images-responsive-reader
      - feat/mail-long-content-resilient-analysis
      - feat/core-local-planner-reminders-v1
      - feat/core-mail-agent-actions-v1
      - feat/inbox-confirm-delete-message-details
      - feat/inbox-selection-clusters-inline-reader
      - feat/core-local-task-planning
      - feat/core-ai-morning-editor
      - feat/core-pro-dashboard-multiselect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-tasks:
    name: task-board (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r apps/core/requirements-mail.lock
      - name: Python offline tests
        env:
          PYTHONPATH: apps/core/src
          PYTHONNOUSERSITE: '1'
        run: python -m unittest discover -s apps/core/tests -v
      - name: UI and shell checks
        run: |
          bash -n scripts/run-okal-core.sh
          node --check apps/core/src/okal_core/static/app.js
          node --test apps/core/tests/test_*.cjs
