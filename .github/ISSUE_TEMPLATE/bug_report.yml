name: Bug report
description: Report a reproducible defect without including secrets or private data.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Do not submit vulnerabilities or secrets here. Use the repository Security policy for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what user-visible impact did it have?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe, deterministic reproduction.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include sanitized errors, receipt IDs, or screenshots. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Okal version/commit, OS, deployment profile, and relevant provider or worker versions.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low — workaround exists; limited impact
        - Medium — important behavior is degraded
        - High — core workflow is blocked or data may be wrong
        - Critical — security, data loss, or unsafe external action
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no secrets, private keys, tokens, or personal data.
          required: true
